<!DOCTYPE html>
<html>
	<head>
		<title>login</title>
		<link rel="stylesheet" href="styles.css">
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	</head>

	<body>

	

		Username
		<input id='user' type='text'>
		Password
		<input id='pass' type='password'>


        <button type="button" onclick="clickButton(document.getElementById('user').value, document.getElementById('pass').value)">Log In</button>

		<a  href="register.html">No Account? Register here</a> 

       

		<script>


		const clickButton = (user, pass) =>{

			const postData = {
				user_name: user,
                password: pass
			};

			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			}
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/login',data);
					const status = await response.json();
					console.log(status);
					if (status.Message =='Login Success') {
						document.location.href = 'index.html';
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error); 
				}
			}

			return fetchData()
	
		}

		</script>

        
	</body>
</html>
